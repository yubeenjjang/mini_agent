name: 01 LLM CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "mini_agent_01_llm/**"
      - ".github/workflows/01-llm-ci-cd.yml"
  pull_request:
    paths:
      - "mini_agent_01_llm/**"
      - ".github/workflows/01-llm-ci-cd.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy Mini Agent 01 to AWS EC2"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mini-agent-01-llm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test and build containers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini_agent_01_llm
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini_agent_01_llm/requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Cloud Provider 키 없이 Mock과 monkeypatch 기반 API 계약을 검증합니다.
      - name: Test backend API contracts
        working-directory: mini_agent_01_llm/backend
        env:
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
        run: python -m pytest tests -q

      # .env는 저장소에 포함하지 않으므로 Compose 구조 검사용 안전한 값을 만듭니다.
      - name: Create CI environment file
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build backend and frontend images
        run: docker compose build

  deploy:
    name: Deploy to AWS EC2
    needs: test-and-build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    # GitHub Settings > Environments에서 wk01 승인 규칙과 배포 시크릿을 관리합니다.
    environment: wk01
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure verified SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy application source
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'mkdir -p ~/mini-agent-01-llm'
          scp -r mini_agent_01_llm/. "$AWS_USER@$AWS_HOST:~/mini-agent-01-llm/"

      - name: Deploy and verify health
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" '
            set -e
            cd ~/mini-agent-01-llm
            test -f .env
            docker compose config --quiet
            docker compose up -d --build

            if ! curl \
              --fail \
              --retry 12 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 5 \
              --max-time 10 \
              http://127.0.0.1:8000/health
            then
              docker compose ps
              docker compose logs --tail=200 backend
              exit 1
            fi
          '
